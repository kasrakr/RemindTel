name = "remindtel"
main = "worker.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "remindtel-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ADMINS = "123456789"
OPENAI_MODEL = "gpt-5.6-luna"
TIMEZONE_OFFSET_MINUTES = "210"
